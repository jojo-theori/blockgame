  <g shape-rendering="crispEdges">
    <g fill="#5cc45c"><rect x="14" y="6" width="4" height="4"/><rect x="14" y="10" width="4" height="4"/><rect x="18" y="10" width="4" height="4"/><rect x="18" y="14" width="4" height="4"/></g>
    <g fill="#e8505b"><rect x="6" y="14" width="4" height="4"/><rect x="10" y="14" width="4" height="4"/><rect x="10" y="18" width="4" height="4"/><rect x="14" y="18" width="4" height="4"/></g>
    <g fill="#f2cb4c"><rect x="18" y="18" width="4" height="4"/><rect x="22" y="18" width="4" height="4"/><rect x="18" y="22" width="4" height="4"/><rect x="22" y="22" width="4" height="4"/></g>
  </g>
</svg>
